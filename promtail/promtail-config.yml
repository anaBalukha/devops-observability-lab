server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: flask-app
          service: observability-app
          __path__: /var/log/app/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            path: path
            method: method
            status: status
            event: event
            request_id: request_id
      - labels:
          level:
          path:
          method:
          status:
          event: