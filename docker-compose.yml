services:
  app:
    build:
      context: ./app
    container_name: observability-app
    ports:
      - "5000:5000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_COLOR: ${APP_COLOR:-blue}
    volumes:
      - app_logs:/var/log/app
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - observability

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yml
    restart: unless-stopped
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - app
      - loki
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - observability

  health-monitor:
    image: python:3.13.14-slim
    container_name: health-monitor
    environment:
      CHECK_INTERVAL_SECONDS: "10"
      REQUEST_TIMEOUT_SECONDS: "3"
      HEALTH_LOG_FILE: /var/log/health/health.log
      APP_HEALTH_URL: http://app:5000/health
      PROMETHEUS_HEALTH_URL: http://prometheus:9090/-/ready
      LOKI_HEALTH_URL: http://loki:3100/ready
      GRAFANA_HEALTH_URL: http://grafana:3000/api/health
    volumes:
      - ./scripts/health_monitor.py:/monitor/health_monitor.py:ro
      - ./logs/health:/var/log/health
    command:
      - python
      - /monitor/health_monitor.py
    depends_on:
      - app
      - prometheus
      - loki
      - grafana
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  app_logs: