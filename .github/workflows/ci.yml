name: CI Quality and Security

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    name: Python Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: python -m ruff check app tests scripts

      - name: Run unit tests with coverage
        run: >
          python -m pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Audit Python dependencies
        run: pip-audit -r app/requirements.txt

      - name: Run Bandit security analysis
        run: bandit -r app -ll

  docker-validation:
    name: Docker Validation and Build
    needs: quality-security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: ci-only-temporary-password
      APP_VERSION: ci
      APP_COLOR: blue

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: |
          cp nginx/default.conf nginx/active.conf
          docker compose config --quiet

      - name: Build application image
        run: docker build --tag observability-app:ci ./app

      - name: Start application container
        run: |
          docker run --detach \
            --name observability-app-ci \
            --publish 5000:5000 \
            observability-app:ci

      - name: Verify application endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://localhost:5000/health \
              > health-response.json
            then
              cat health-response.json
              exit 0
            fi

            echo "Waiting for application: ${attempt}/30"
            sleep 2
          done

          docker logs observability-app-ci
          exit 1

      - name: Verify Docker health check
        run: |
          for attempt in {1..30}; do
            status="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                observability-app-ci
            )"

            echo "Container health: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker logs observability-app-ci
              exit 1
            fi

            sleep 2
          done

          docker logs observability-app-ci
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm --force observability-app-ci || true

  deployment-verification:
    name: Blue-Green Deployment Verification
    needs: docker-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare local deployment environment
        run: |
          cat > .env <<'EOF'
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=ci-only-temporary-password
          APP_VERSION=1.0.0
          APP_COLOR=blue
          EOF

          mkdir -p .deployment

          printf "blue\n" > .deployment/active_color
          printf "blue\n" > .deployment/previous_color

          cp nginx/default.conf nginx/active.conf

      - name: Validate deployment configuration
        run: |
          bash -n \
            scripts/deploy.sh \
            scripts/rollback.sh \
            scripts/setup.sh

          docker compose config --quiet

      - name: Start complete environment
        run: docker compose up -d --build

      - name: Verify initial environment
        run: |
          python scripts/smoke_test.py

          response="$(curl --fail --silent http://localhost:5000/health)"

          echo "Initial public response: ${response}"

          python -c '
          import json
          import sys

          data = json.loads(sys.argv[1])

          assert data["status"] == "UP"
          assert data["color"] == "blue"
          ' "$response"

      - name: Deploy green version
        run: bash scripts/deploy.sh 1.1.0

      - name: Verify green deployment
        run: |
          response="$(curl --fail --silent http://localhost:5000/health)"

          echo "Green public response: ${response}"

          python -c '
          import json
          import sys

          data = json.loads(sys.argv[1])

          assert data["status"] == "UP"
          assert data["color"] == "green"
          assert data["version"] == "1.1.0"
          ' "$response"

          test "$(cat .deployment/active_color)" = "green"

      - name: Roll back to blue
        run: bash scripts/rollback.sh

      - name: Verify rollback and smoke tests
        run: |
          response="$(curl --fail --silent http://localhost:5000/health)"

          echo "Rollback public response: ${response}"

          python -c '
          import json
          import sys

          data = json.loads(sys.argv[1])

          assert data["status"] == "UP"
          assert data["color"] == "blue"
          ' "$response"

          test "$(cat .deployment/active_color)" = "blue"

          python scripts/smoke_test.py

      - name: Show service status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100

      - name: Clean up deployment environment
        if: always()
        run: docker compose down --volumes --remove-orphans